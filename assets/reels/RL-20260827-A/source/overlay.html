<meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(Poppins-600.ttf);font-weight:600}
@font-face{font-family:P;src:url(Poppins-700.ttf);font-weight:700}
@font-face{font-family:P;src:url(Poppins-800.ttf);font-weight:800}
@font-face{font-family:P;src:url(Poppins-900.ttf);font-weight:900}
@font-face{font-family:H;src:url(DancingScript-600.ttf);font-weight:600}
@font-face{font-family:H;src:url(DancingScript-700.ttf);font-weight:700}

:root{--blue:#238FFE;--pink:#FE0178;--green:#5FE127;--cream:#F2EBDD;--ink:#1B1338}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:P,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px}

.scrim-b{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,7,22,.90) 0%,rgba(10,7,22,.80) 20%,rgba(10,7,22,.40) 46%,rgba(10,7,22,0) 66%)}
.scrim-t{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,7,22,.55) 0%,rgba(10,7,22,.12) 14%,rgba(10,7,22,0) 26%)}

/* ---------- notas escritas a mano ---------- */
.card{position:absolute;left:100px;right:90px;bottom:330px}
.line{display:block;position:relative;width:max-content;white-space:nowrap}
.line + .line{margin-top:-10px}
.txt{display:block;font-family:H,cursive;font-weight:700;font-size:94px;line-height:1.32;
  color:#fff;letter-spacing:.004em;
  text-shadow:0 4px 26px rgba(0,0,0,.62),0 1px 3px rgba(0,0,0,.5)}
.txt b{font-weight:700;color:var(--pink)}
.txt i{font-style:normal;font-weight:700;color:var(--green)}
.nib{position:absolute;top:54%;left:0;width:0;height:0;opacity:0}
.nib::after{content:'';position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 0 26px 8px rgba(255,255,255,.45)}

#wm{position:absolute;top:74px;left:96px;transform-origin:top left;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#wm .tag{display:none}

.logo{display:inline-block;text-align:center}
.mic{position:relative;display:inline-flex;font-family:P;font-weight:900;font-size:210px;line-height:.9;letter-spacing:-.045em}
.mic .m{color:var(--blue)}.mic .i{color:var(--green)}.mic .c{color:var(--pink)}
.leaf{position:absolute;width:58px;right:-16px;top:-30px;fill:var(--pink);transform:rotate(14deg);transform-origin:50% 90%}
.tag{margin-top:6px;display:flex;justify-content:center;gap:12px;font-family:P;font-weight:800;font-size:30px;letter-spacing:.15em}
.tag .p{color:var(--pink)}.tag .b{color:var(--blue)}.tag .g{color:var(--green)}

#outro{position:absolute;inset:0;background:var(--cream);overflow:hidden}
.blob{position:absolute;border-radius:50%}
.b1{width:760px;height:760px;background:#F9C9DA;right:-230px;top:-210px}
.b2{width:620px;height:620px;background:#BFE4FB;left:-220px;bottom:520px}
.b3{width:560px;height:560px;background:#FBEEC2;right:-160px;bottom:-190px}
#outro .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#outro .logo{transform-origin:50% 60%}
.oline{margin-top:70px;font-family:H,cursive;font-weight:700;font-size:62px;line-height:1.28;
  color:var(--ink);text-align:center;max-width:820px}
.handle{margin-top:40px;display:inline-flex;align-items:center;gap:16px;padding:20px 40px;border-radius:999px;
  background:var(--ink);color:#fff;font-family:P;font-weight:700;font-size:36px}
.handle svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2.1}

/* ---------- keyframes ---------- */
@keyframes write{from{clip-path:inset(-14% 104% -26% -4%)}to{clip-path:inset(-14% -6% -26% -4%)}}
@keyframes nibRun{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--w,0px));opacity:0}}
@keyframes nibOff{from{opacity:1}to{opacity:0}}
@keyframes cardOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-38px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:scale(.78) translateY(30px)}to{opacity:1;transform:none}}
@keyframes leafIn{0%{opacity:0;transform:rotate(-70deg) scale(0)}70%{opacity:1;transform:rotate(24deg) scale(1.14)}100%{opacity:1;transform:rotate(14deg) scale(1)}}
@keyframes wmIn{from{opacity:0;transform:scale(.50) translateY(14px)}to{opacity:.97;transform:scale(.50)}}
</style>

<div id="stage">
  <div class="scrim-t" id="scrimT"></div>
  <div class="scrim-b" id="scrimB"></div>

  <div id="wm">
    <div class="logo">
      <div class="mic"><span class="m">M</span><span class="i">I</span><span class="c">C</span>
        <svg class="leaf" viewBox="0 0 100 112"><path d="M50 2 L45 33 L32 17 L28 28 L6 22 L12 44 L3 50 L24 68 L20 86 L47 80 L47 110 L53 110 L53 80 L80 86 L76 68 L97 50 L88 44 L94 22 L72 28 L68 17 L55 33 Z"/></svg>
      </div>
      <div class="tag"><span class="p">MASHA</span><span class="b">IN</span><span class="g">CANADA</span></div>
    </div>
  </div>

  <div id="cards"></div>

  <div id="outro">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="inner">
      <div class="logo" id="olg">
        <div class="mic"><span class="m">M</span><span class="i">I</span><span class="c">C</span>
          <svg class="leaf" id="oleaf" viewBox="0 0 100 112"><path d="M50 2 L45 33 L32 17 L28 28 L6 22 L12 44 L3 50 L24 68 L20 86 L47 80 L47 110 L53 110 L53 80 L80 86 L76 68 L97 50 L88 44 L94 22 L72 28 L68 17 L55 33 Z"/></svg>
        </div>
        <div class="tag"><span class="p">MASHA</span><span class="b">IN</span><span class="g">CANADA</span></div>
      </div>
      <div class="oline" id="oline">Te cuento cómo es vivir aquí,<br>de verdad</div>
      <div class="handle" id="ohandle">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.1" fill="#fff" stroke="none"/></svg>
        @mashaincanada
      </div>
    </div>
  </div>
</div>

<script>
// s = cuándo empieza a escribirse, e = cuándo desaparece, l = líneas
const CARDS = [
  {s:0.70, e:5.70, tilt:-1.1, l:['Hoy no hubo trámites,','ni correos, ni entrevistas.']},
  {s:5.95, e:11.00,tilt: 0.8, l:['Solo una carpa,','una fogata,','y un bosque enorme.']},
  {s:11.25,e:16.30,tilt:-0.9, l:['Cuando recién llegué,','esto se sentía imposible.']},
  {s:16.55,e:21.20,tilt: 0.7, l:['Y mírame:','ahora esto también','es <i>mi casa</i>.']},
  {s:21.45,e:25.90,tilt:-0.8, l:['Si vas empezando,','<b>escríbeme</b>.','Yo también empecé así.']}
];
const OUTRO_START = 25.95;
const SPEED = 0.049;   // segundos por carácter
const GAP   = 0.16;    // pausa entre líneas

const cont = document.getElementById('cards');
CARDS.forEach(c=>{
  const d = document.createElement('div');
  d.className = 'card';
  d.style.transform = `rotate(${c.tilt}deg)`;
  d.style.animation = `cardOut .42s cubic-bezier(.4,0,.7,.2) ${(c.e-0.42).toFixed(2)}s both`;
  let t = c.s, html = '';
  c.l.forEach(line=>{
    const chars = line.replace(/<[^>]+>/g,'').length;
    const dur = Math.max(0.65, chars*SPEED);
    html += `<span class="line">
      <span class="txt" style="animation:write ${dur.toFixed(2)}s linear ${t.toFixed(2)}s both">${line}</span>
      <span class="nib" style="animation:nibRun ${dur.toFixed(2)}s linear ${t.toFixed(2)}s forwards"></span>
    </span>`;
    t += dur + GAP;
  });
  d.innerHTML = html;
  cont.appendChild(d);
});

document.querySelectorAll('.line').forEach(l=>{
  const nib = l.querySelector('.nib');
  if(nib) nib.style.setProperty('--w', Math.round(l.getBoundingClientRect().width)+'px');
});

document.getElementById('wm').style.animation =
  `wmIn .7s cubic-bezier(.2,.9,.3,1) .9s both, fadeOut .3s linear ${(OUTRO_START-0.15).toFixed(2)}s both`;
const sc = `fadeOut .4s linear ${(OUTRO_START-0.10).toFixed(2)}s both`;
document.getElementById('scrimT').style.animation = sc;
document.getElementById('scrimB').style.animation = sc;

document.getElementById('outro').style.animation  = `fadeIn .55s cubic-bezier(.4,0,.2,1) ${OUTRO_START}s both`;
document.getElementById('olg').style.animation    = `logoIn .8s cubic-bezier(.18,.92,.24,1.02) ${(OUTRO_START+0.28).toFixed(2)}s both`;
document.getElementById('oleaf').style.animation  = `leafIn .75s cubic-bezier(.2,.9,.3,1) ${(OUTRO_START+0.70).toFixed(2)}s both`;
document.getElementById('oline').style.animation  = `riseIn .7s cubic-bezier(.18,.9,.26,1) ${(OUTRO_START+0.95).toFixed(2)}s both`;
document.getElementById('ohandle').style.animation= `riseIn .7s cubic-bezier(.18,.9,.26,1) ${(OUTRO_START+1.25).toFixed(2)}s both`;

window.__seek = ms => document.getAnimations().forEach(a=>{a.pause(); a.currentTime = ms;});
</script>
