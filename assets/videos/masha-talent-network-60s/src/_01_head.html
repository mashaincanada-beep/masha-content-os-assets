<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MASHA Talent Network — 60s</title>
<style>
@font-face{font-family:'Inter';src:url('inter-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}

:root{
  --navy:#121e46; --navy2:#1a2757; --drawer:#151f4b;
  --bg:#eef0f7; --card:#ffffff; --line:#e4e8f2;
  --ink:#0f172a; --muted:#6b748d; --soft:#98a0b8;
  --blue:#2b7cf6; --green:#22c55e; --pink:#e6007e; --violet:#7c3aed; --amber:#dd9b13;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1920px;background:#05070f;overflow:hidden;}
body{font-family:'Inter','Liberation Sans',sans-serif;}

#stage{position:absolute;top:0;left:0;width:420px;height:746.6667px;overflow:hidden;
  transform:scale(2.5714286);transform-origin:top left;background:#05070f;}

.screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);opacity:0;will-change:opacity,transform;}

/* ---------- chrome ---------- */
.urlbar{height:30px;background:#e2e5ef;display:flex;align-items:center;justify-content:center;}
.urlpill{background:#fff;border-radius:99px;padding:3.5px 13px;font-size:10.5px;color:#4a5470;font-weight:500;
  display:flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgba(15,23,42,.10);}
.urlpill .lk{width:8px;height:8px;border:1.4px solid #7c869f;border-radius:2px;position:relative;}
.urlpill .lk:before{content:'';position:absolute;left:1.4px;top:-3.4px;width:4px;height:4px;border:1.4px solid #7c869f;border-bottom:none;border-radius:3px 3px 0 0;}

.hdr{height:52px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.logo{display:flex;flex-direction:column;gap:4px;}
.logo .w{font-size:16.5px;letter-spacing:-.2px;color:#fff;font-weight:400;}
.logo .w b{font-weight:800;}
.logo .bar{display:flex;width:98px;height:3px;border-radius:2px;overflow:hidden;}
.logo .bar i{flex:1;}
.logo .bar i:nth-child(1){background:#2b7cf6;}
.logo .bar i:nth-child(2){background:#3ddc6b;}
.logo .bar i:nth-child(3){background:#e6007e;}
.burger{width:22px;display:flex;flex-direction:column;gap:4.5px;}
.burger i{height:2px;background:#dfe4f5;border-radius:2px;}

.view{position:absolute;top:82px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg);}
.page{position:absolute;top:0;left:0;right:0;padding:16px 14px 220px;will-change:transform;}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;
  box-shadow:0 1px 2px rgba(16,24,54,.05),0 6px 18px rgba(16,24,54,.05);margin-bottom:11px;}
.ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.ic.b{background:#e8f0fe;} .ic.g{background:#e6f8ee;} .ic.p{background:#fde8f3;}
.ic.v{background:#eee9fd;} .ic.a{background:#fdf1dc;} .ic.s{background:#eef1f8;}

.h1{font-size:23px;font-weight:800;letter-spacing:-.6px;color:var(--ink);}
.h2{font-size:17px;font-weight:800;letter-spacing:-.35px;color:var(--ink);}
.h3{font-size:14.5px;font-weight:700;letter-spacing:-.2px;color:var(--ink);}
.sub{font-size:11.5px;color:var(--muted);line-height:1.45;}
.tiny{font-size:9.5px;color:var(--soft);font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3.5px 9px;font-size:9px;font-weight:800;letter-spacing:.35px;text-transform:uppercase;}
.pill.g{background:#dff6e7;color:#12813f;} .pill.p{background:#fde4f0;color:#c1046d;}
.pill.b{background:#e3edfe;color:#1c5fd0;} .pill.a{background:#fdefd6;color:#9b6a05;}
.pill.s{background:#eaeef7;color:#5b6483;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 15px;
  font-size:12px;font-weight:700;background:var(--blue);color:#fff;}
.btn.wide{width:100%;padding:12px;font-size:13.5px;border-radius:12px;}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn.pinkb{background:var(--pink);}
.btn.greenb{background:#16a34a;}
.lnk{font-size:11.5px;font-weight:700;color:var(--blue);}

.field{border:1px solid #dfe4ef;border-radius:9px;padding:8.5px 10px;font-size:11.5px;color:var(--ink);background:#fff;margin-top:4px;}
.lbl{font-size:10.5px;color:#4b5570;font-weight:600;margin-top:9px;}

.hero{border-radius:17px;padding:17px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#171442 0%,#2a1856 45%,#0f2b52 100%);}
.hero:after{content:'';position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.28;
  background-image:radial-gradient(#7c8cff 1.1px,transparent 1.1px);background-size:9px 9px;}

.prog{height:6px;border-radius:99px;background:#e6eaf4;overflow:hidden;}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2b7cf6,#3ddc6b);}

/* ---------- captions ---------- */
#cap{position:absolute;left:0;right:0;bottom:0;height:210px;display:flex;align-items:flex-end;
  padding:0 22px 30px;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,9,24,0) 0%,rgba(6,9,24,.55) 32%,rgba(6,9,24,.90) 72%,rgba(6,9,24,.95) 100%);}
#capT{font-size:20.5px;font-weight:800;line-height:1.26;letter-spacing:-.4px;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.5);}
#capT em{font-style:normal;color:#4ade80;}
#capT u{text-decoration:none;color:#ff5bb0;}

/* ---------- cursor ---------- */
#cur{position:absolute;width:27px;height:27px;border-radius:99px;background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 14px rgba(0,0,0,.35);
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:60;}
#rip{position:absolute;width:27px;height:27px;border-radius:99px;border:2.5px solid rgba(255,255,255,.85);
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:59;}
</style>
</head>
<body>
<div id="stage">
